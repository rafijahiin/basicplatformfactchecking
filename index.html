// ===== SHEEP PAGE =====
function SHEEPPage({ lang, addXP }) {
  const [stepIdx, setStepIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [done, setDone] = useState(false);

  function toggleAnswer(stepI, qI) {
    const key = `${stepI}-${qI}`;
    setAnswers(a => ({...a, [key]:!a[key]}));
  }

  function nextStep() {
    if (stepIdx < SHEEP_STEPS.length-1) setStepIdx(s=>s+1);
    else { setDone(true); addXP(15, lang==='bn'?'SHEEP যাচাই সম্পন্ন':'SHEEP verification done'); }
  }

  const step = SHEEP_STEPS[stepIdx];

  if (done) return (
    <div className="page">
      <div style={{maxWidth:680,margin:'0 auto',padding:'24px 16px'}}>
        <div className="card" style={{background:'#F0FDF4',borderColor:'#BBF7D0',textAlign:'center'}}>
          <div style={{fontSize:40,marginBottom:12}}>✅</div>
          <div style={{fontFamily:'Inter,sans-serif',fontSize:22,fontWeight:700,color:'#15803D',marginBottom:8,letterSpacing:'-0.01em'}}>
            {lang==='bn'?'SHEEP যাচাই সম্পন্ন!':'SHEEP Verification Complete!'}
          </div>
          <p style={{fontSize:14,color:'var(--mid)',lineHeight:1.7,marginBottom:20}}>
            {lang==='bn'
              ?'আপনি সমস্ত ৫টি ধাপ সম্পন্ন করেছেন। এই চেকলিস্টটি First Draft-এর SHEEP Framework এবং Bellingcat OSINT পদ্ধতির উপর ভিত্তি করে তৈরি।'
              :'You have completed all 5 steps. This checklist is based on First Draft\'s SHEEP Framework and Bellingcat\'s OSINT methodology.'}
          </p>
          <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:8,marginBottom:24}}>
            {SHEEP_STEPS.map(s => (
              <div key={s.letter} style={{background:'white',borderRadius:6,padding:'10px 4px',textAlign:'center',border:`2px solid ${s.color}`}}>
                <div style={{fontFamily:'Inter,sans-serif',fontSize:20,fontWeight:800,color:s.color}}>{s.letter}</div>
                <div style={{fontSize:10,color:'var(--mid)',fontWeight:500,marginTop:4}}>{lang==='bn'?s.wordBn:s.wordEn}</div>
              </div>
            ))}
          </div>
          <button className="btn-outline" onClick={() => {setStepIdx(0);setAnswers({});setDone(false);}}>
            🔄 {lang==='bn'?'নতুন যাচাই':'New Verification'}
          </button>
        </div>
        <div className="module-card card" style={{marginTop:20}}>
          <div className="module-section-tag">BELLINGCAT OSINT TOOLKIT</div>
          <div className="module-title" style={{fontSize:18}}>{lang==='bn'?'উন্নত যাচাই সরঞ্জাম':'Advanced Verification Tools'}</div>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {[
              {tool:'Google Reverse Image Search',url:'https://images.google.com',desc:lang==='bn'?'ছবির আসল উৎস ও তারিখ খুঁজুন':'Find original image source and date'},
              {tool:'TinEye',url:'https://tineye.com',desc:lang==='bn'?'ছবির প্রথম প্রকাশনা তারিখ':'Find when an image was first published'},
              {tool:'InVID/WeVerify',url:'https://weverify.eu/verification-plugin/',desc:lang==='bn'?'ভিডিও কীফ্রেম রিভার্স সার্চ':'Video keyframe reverse search'},
              {tool:'Google Maps Street View',url:'https://maps.google.com',desc:lang==='bn'?'ভিডিও/ছবির অবস্থান যাচাই':'Verify location of videos/images'},
              {tool:'Metadata2go',url:'https://www.metadata2go.com',desc:lang==='bn'?'ছবির মেটাডেটা (GPS, তারিখ) পড়ুন':'Read image metadata (GPS, date)'},
            ].map((t,i) => (
              <div key={i} style={{padding:'12px 16px',background:'var(--bg-color)',borderRadius:6,border:'1px solid var(--border)'}}>
                <div style={{fontWeight:600,fontSize:14,color:'var(--dark)',marginBottom:4}}>{t.tool}</div>
                <div style={{fontSize:13,color:'var(--mid)'}}>{t.desc}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );

  return (
    <div className="page">
      <div className="game-header">
        <div className="game-header-title">🐑 SHEEP {lang==='bn'?'যাচাই ফ্রেমওয়ার্ক':'Verification Framework'}</div>
        <div className="game-header-sub">{lang==='bn'?'First Draft পদ্ধতি — দ্রুত তথ্য যাচাইয়ের চেকলিস্ট':'First Draft method — quick verification checklist'}</div>
        <div className="game-progress-bar-wrap"><div className="game-progress-bar-fill" style={{width:`${((stepIdx)/SHEEP_STEPS.length)*100}%`}}/></div>
        <div className="game-counter">{lang==='bn'?`ধাপ ${stepIdx+1}/${SHEEP_STEPS.length}:`:`Step ${stepIdx+1}/${SHEEP_STEPS.length}:`} {lang==='bn'?step.wordBn:step.wordEn}</div>
      </div>
      <div style={{maxWidth:680,margin:'0 auto',padding:'24px 16px'}}>
        <div style={{display:'flex',gap:8,marginBottom:20,flexWrap:'wrap'}}>
          {SHEEP_STEPS.map((s,i) => (
            <div key={s.letter} style={{width:40,height:40,borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Inter,sans-serif',fontWeight:700,fontSize:16,background:i<=stepIdx?s.color:'var(--bg-alt)',color:i<=stepIdx?'white':'var(--light)',transition:'all 0.3s', border:i>stepIdx?'1px solid var(--border)':'none'}}>{s.letter}</div>
          ))}
        </div>
        <div className={`sheep-step active card`} style={{borderColor:step.color}}>
          <div style={{display:'flex',gap:16,marginBottom:16}}>
            <div className="sheep-letter" style={{background:step.color+'15',color:step.color}}>{step.letter}</div>
            <div>
              <div style={{fontFamily:'Inter,sans-serif',fontWeight:700,fontSize:18,color:'var(--dark)'}}>{lang==='bn'?step.wordBn:step.wordEn}</div>
              <div style={{fontSize:14,color:'var(--mid)',marginTop:2}}>{lang==='bn'?step.titleBn:step.titleEn}</div>
            </div>
          </div>
          <div style={{fontSize:14,color:'var(--mid)',marginBottom:16,lineHeight:1.7,fontWeight:500}}>
            {lang==='bn'?`প্রতিটি প্রশ্নের উত্তর ✓ দিয়ে চিহ্নিত করুন:`:`Check each question as you verify:`}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {(lang==='bn'?step.questionsBn:step.questionsEn).map((q,i) => {
              const key = `${stepIdx}-${i}`;
              return (
                <div key={i} onClick={() => toggleAnswer(stepIdx,i)} style={{display:'flex',gap:12,alignItems:'flex-start',padding:'12px 14px',background:answers[key]?'#F0FDF4':'var(--bg-color)',borderRadius:6,cursor:'pointer',border:`1px solid ${answers[key]?'#22C55E':'var(--border)'}`,transition:'all 0.2s'}}>
                  <div style={{width:20,height:20,borderRadius:4,border:`1.5px solid ${answers[key]?'#15803D':'var(--light)'}`,background:answers[key]?'#15803D':'white',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:12,color:'white',marginTop:1}}>{answers[key]?'✓':''}</div>
                  <span style={{fontSize:14,lineHeight:1.5,color:answers[key]?'#15803D':'var(--dark)'}}>{q}</span>
                </div>
              );
            })}
          </div>
          <div style={{marginTop:20,padding:'12px 16px',background:step.color+'0A',borderRadius:6,borderLeft:`3px solid ${step.color}`}}>
            <div style={{fontSize:12,fontWeight:700,color:step.color,marginBottom:6}}>💡 Tip</div>
            <div style={{fontSize:13,color:'var(--mid)',lineHeight:1.6}}>{lang==='bn'?step.tipBn:step.tipEn}</div>
          </div>
        </div>
        <button className="btn-primary" onClick={nextStep} style={{width:'100%',justifyContent:'center',marginTop:12}}>
          {stepIdx<SHEEP_STEPS.length-1?(lang==='bn'?`পরবর্তী ধাপ: ${SHEEP_STEPS[stepIdx+1].wordBn} →`:`Next: ${SHEEP_STEPS[stepIdx+1].wordEn} →`):(lang==='bn'?'যাচাই সম্পন্ন করুন →':'Complete Verification →')}
        </button>
      </div>
    </div>
  );
}

// ===== AI CHECKER PAGE =====
function AICheckerPage({ lang, addXP }) {
  const [claim, setClaim] = useState('');
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');

  async function checkFact() {
    if (!claim.trim()) return;
    setLoading(true); setResult(null); setError('');

    // Local keyword-based fact-checker (works without an API key or internet)
    await new Promise(r => setTimeout(r, 1200)); // simulate processing delay
    try {
      const c = claim.toLowerCase();

      // ── known FALSE claims ──
      const falsePatterns = [
        {k:['india','trade','block','ban','bangladesh','বাণিজ্য','ভারত','বন্ধ'],
         summary:'No credible source confirms India has blocked trade with Bangladesh. FactWatch verified India-Bangladesh trade remains normal. The claim often circulates with misattributed images from older disputes.',
         keyPoints:['India-Bangladesh bilateral trade was valued at over $14 billion in 2024','No official notification from either government about a trade ban','Images used in this claim have been traced to unrelated 2021 border incidents'],
         advice:'Cross-check with FactWatch BD or Rumor Scanner before sharing trade or diplomatic claims.',
         conflict:'high', sheep:'Source'},
        {k:['papaya','dengue','cure','পেঁপে','ডেঙ্গু','নিরাময়','পাতা'],
         summary:'WHO and DGHS Bangladesh confirm papaya leaf juice is not a scientifically proven cure for Dengue. Sharing this claim can delay proper medical care and is potentially dangerous.',
         keyPoints:['No peer-reviewed clinical trial has validated papaya leaf as a Dengue cure','Overdosing on paracetamol (often combined) causes severe liver damage','DGHS recommends rest, hydration, and medical monitoring for Dengue'],
         advice:'Always consult a registered physician for medical advice. Never delay hospital care based on social media remedies.',
         conflict:'medium', sheep:'Evidence'},
        {k:['emergency','জরুরি অবস্থা','ban','opposition','নিষিদ্ধ','সরকার'],
         summary:'No emergency has been declared in Bangladesh per the President\'s Office and Ministry of Law. This type of claim spreads rapidly during political tension and is designed to cause fear.',
         keyPoints:['Emergency declarations require gazette notification — none has been issued','Both the President\'s Office and Ministry of Law denied any ban','Unverified Facebook accounts are the primary source of this claim'],
         advice:'Check official government portals (cabinet.gov.bd) before sharing political emergency claims.',
         conflict:'high', sheep:'Source'},
        {k:['ai','image','always','easy','সহজ','চেনা','ধরা'],
         summary:'AI-generated images are increasingly difficult to detect. A BRAC 2026 study found 67% of Bangladeshi youth aged 18-25 cannot identify AI-generated images. The claim is misleading.',
         keyPoints:['Modern AI (Midjourney, DALL-E 4, Stable Diffusion) produces near-photorealistic images','Even trained experts make mistakes without detection tools','Tools like Hive Moderation, AI or Not, and InVID help but are not 100% accurate'],
         advice:'Use reverse image search and AI-detection tools rather than relying on visual judgment alone.',
         conflict:'low', sheep:'Evidence'},
        {k:['free','toll','padma','bridge','পদ্মা','সেতু','বিনামূল্যে','ফ্রি'],
         summary:'Padma Bridge Authority has made no announcement about free toll passes. This appears to be a phishing scam designed to steal personal data.',
         keyPoints:['The official Padma Bridge toll system has not changed','The linked website (.xyz domain) is not affiliated with the government','Clicking such links can expose your personal and financial data'],
         advice:'Never click unverified links claiming government benefits. Check padmabridge.gov.bd directly.',
         conflict:'low', sheep:'Source'},
      ];

      // ── known TRUE / REAL claims ──
      const truePatterns = [
        {k:['mit','2018','false','faster','6','six','মিথ্যা','দ্রুত','ছড়ায়'],
         summary:'This is accurate. A 2018 MIT Media Lab study published in Science journal confirmed false information spreads approximately 6 times faster than true information on Twitter/X.',
         keyPoints:['Study analysed 126,000 stories tweeted by 3 million people over 10 years','Falsehoods were 70% more likely to be retweeted than true stories','Human behaviour — not bots — was the primary driver of false-news spread'],
         advice:'This is credible research. It can be safely shared to raise awareness about misinformation.',
         conflict:'low', sheep:null},
        {k:['bmd','cyclone','warning','signal','ঘূর্ণিঝড়','সতর্কতা','বিএমডি'],
         summary:'Official Bangladesh Meteorological Department (BMD) alerts are verified through multiple government channels and are reliable emergency information.',
         keyPoints:['BMD issues alerts via official website (bmd.gov.bd) and mobile apps','Signals are cross-broadcast by all licensed broadcast media','Coastal residents should always follow BMD instructions during cyclone season'],
         advice:'Follow official BMD instructions. Share only the official alert, not unofficial reposts.',
         conflict:'low', sheep:null},
      ];

      let verdict, summary, keyPoints, advice, conflictSensitivity, sheepFlag;

      const matched = falsePatterns.find(p => p.k.filter(k => c.includes(k)).length >= 2);
      const matchedTrue = truePatterns.find(p => p.k.filter(k => c.includes(k)).length >= 2);

      // ── emotion/urgency indicators → Misleading ──
      const emotionWords = ['share now','share immediately','শেয়ার করুন','এখনই','সতর্ক করুন','সবাইকে','!!','🚨','alert','breaking','exposed','ফাঁস','wake up','জেগে ওঠো'];
      const hasEmotion = emotionWords.some(w => c.includes(w.toLowerCase()));

      // ── conspiracy indicators ──
      const conspiracyWords = ['government hiding','সরকার লুকাচ্ছে','secret','গোপন','they don\'t want','জানতে পারবে না','ngo','funded by','টাকা দেয়'];
      const hasConspiracy = conspiracyWords.some(w => c.includes(w.toLowerCase()));

      if (matched) {
        verdict='False'; summary=matched.summary; keyPoints=matched.keyPoints;
        advice=matched.advice; conflictSensitivity=matched.conflict; sheepFlag=matched.sheep;
      } else if (matchedTrue) {
        verdict='True'; summary=matchedTrue.summary; keyPoints=matchedTrue.keyPoints;
        advice=matchedTrue.advice; conflictSensitivity=matchedTrue.conflict; sheepFlag=matchedTrue.sheep;
      } else if (hasConspiracy) {
        verdict='Misleading';
        summary='This claim contains conspiracy framing — suggesting hidden actors or suppressed truths without citing verifiable sources. Conspiracy-framed claims are a common disinformation tactic identified in UNESCO MIL Module 4.';
        keyPoints=['No named source or verifiable evidence is provided','The framing ("they are hiding it") is a classic SHEEP red flag under Source and Evidence','Cross-reference with IFCN-certified fact-checkers like FactWatch BD or Rumor Scanner'];
        advice='Search for independent verification before sharing. Ask: who benefits from spreading this claim?';
        conflictSensitivity='high'; sheepFlag='Source';
      } else if (hasEmotion) {
        verdict='Misleading';
        summary='This claim uses high-emotion language designed to trigger immediate sharing. The SHEEP framework\'s "E" (Emotion) step warns that strong emotional triggers — urgency, fear, outrage — are deliberate tactics to bypass critical thinking.';
        keyPoints=['Urgency ("share now", "warn everyone") is the #1 manipulation tactic in viral misinformation','Legitimate emergency alerts come from official channels, not forwarded messages','Pause for at least 3 seconds and check one independent source before sharing'];
        advice='Pause. Verify. Then decide. Check FactWatch BD or Rumor Scanner before forwarding.';
        conflictSensitivity='medium'; sheepFlag='Emotion';
      } else {
        verdict='Unverifiable';
        summary='This specific claim could not be matched against known fact-checked content in this offline database. It may still be false, misleading, or true — independent verification is essential.';
        keyPoints=['Use SHEEP framework: check Source, History, Evidence, Emotion, and Pictures/Video','Search FactWatch BD (factwatch.com.bd) or Rumor Scanner (rumorscanner.com) for verified information','Apply Lateral Reading: open multiple tabs and check what other sources say about the claim'];
        advice='When in doubt, don\'t share. Consult IFCN-certified Bangladeshi fact-checkers for a definitive verdict.';
        conflictSensitivity='medium'; sheepFlag='Evidence';
      }

      setResult({verdict, summary, keyPoints, advice, conflictSensitivity, sheepFlag});
      addXP(10, lang==='bn'?'AI ফ্যাক্ট-চেক':'AI fact-check');
    } catch(e) {
      setError(lang==='bn'?'যাচাই করা সম্ভব হয়নি। আবার চেষ্টা করুন।':'Unable to verify. Please try again.');
    }
    setLoading(false);
  }

  const EXAMPLES = lang==='bn' ? [
    'ভারত বাংলাদেশের সাথে সমস্ত বাণিজ্য বন্ধ করে দিয়েছে',
    'AI-তৈরি ছবি সহজেই চেনা যায়',
    'পেঁপের পাতার রস ডেঙ্গু নিরাময় করে',
  ] : [
    'India has completely blocked all trade with Bangladesh',
    'AI-generated images are always easy to identify',
    'Papaya leaf juice cures Dengue fever',
  ];

  const getVerdictClass = v => v==='True'?'verdict-true':v==='False'?'verdict-false':v==='Misleading'?'verdict-misleading':v==='Partially True'?'verdict-partial':'verdict-unknown';

  return (
    <div className="page">
      <div className="game-header">
        <div className="game-header-title">🤖 {lang==='bn'?'AI ফ্যাক্ট-চেকার':'AI Fact-Checker'}</div>
        <div className="game-header-sub">{lang==='bn'?'Claude AI দিয়ে চালিত — IFCN নির্দেশিকা অনুযায়ী':'Powered by Claude AI — aligned with IFCN guidelines'}</div>
      </div>
      <div style={{maxWidth:680,margin:'0 auto',padding:'24px 16px'}}>
        <div style={{background:'#FFFBEB',borderRadius:6,padding:'12px 16px',marginBottom:20,fontSize:13,color:'#B45309',border:'1px solid #FDE68A',lineHeight:1.6}}>
          ⚠️ <span style={{fontWeight:600}}>{lang==='bn'?'লক্ষ্য করুন: ':'Notice: '}</span>{lang==='bn'?'AI বিশ্লেষণ একটি সহায়ক টুল — চূড়ান্ত যাচাইয়ের জন্য সর্বদা FactWatch ও Rumor Scanner ব্যবহার করুন।':'AI analysis is a guide tool — always use FactWatch & Rumor Scanner for definitive verification.'}
        </div>
        <textarea value={claim} onChange={e=>setClaim(e.target.value)}
          placeholder={lang==='bn'?'একটি দাবি, সংবাদ শিরোনাম বা সোশ্যাল মিডিয়া পোস্ট পেস্ট করুন...':'Paste a claim, headline, or social media post to verify...'}
          style={{width:'100%',minHeight:100,padding:16,borderRadius:6,border:'1px solid var(--border)',fontSize:15,lineHeight:1.6,resize:'vertical',fontFamily:'Inter, Hind Siliguri,sans-serif',color:'var(--dark)',background:'white',boxSizing:'border-box',boxShadow:'inset 0 1px 2px rgba(0,0,0,0.02)'}}/>
        <div style={{display:'flex',gap:8,margin:'12px 0',flexWrap:'wrap'}}>
          {EXAMPLES.map((e,i) => (
            <button key={i} onClick={() => setClaim(e)} style={{padding:'6px 12px',background:'var(--bg-color)',border:'1px solid var(--border)',borderRadius:16,fontSize:12,cursor:'pointer',color:'var(--mid)',fontFamily:'Inter, Hind Siliguri,sans-serif',transition:'all 0.2s'}} onMouseOver={(e)=>{e.target.style.background='var(--primary-pale)';e.target.style.borderColor='var(--primary-light)';e.target.style.color='var(--primary-dark)'}} onMouseOut={(e)=>{e.target.style.background='var(--bg-color)';e.target.style.borderColor='var(--border)';e.target.style.color='var(--mid)'}}>{e}</button>
          ))}
        </div>
        <button onClick={checkFact} disabled={loading||!claim.trim()} style={{padding:'12px 24px',background:claim.trim()&&!loading?'var(--primary)':'var(--bg-alt)',color:claim.trim()&&!loading?'white':'var(--light)',border:'1px solid transparent',borderColor:claim.trim()&&!loading?'transparent':'var(--border)',borderRadius:6,cursor:loading||!claim.trim()?'not-allowed':'pointer',fontWeight:600,fontSize:14,fontFamily:'Inter, Hind Siliguri,sans-serif',display:'flex',alignItems:'center',gap:8,marginTop:16,transition:'all 0.2s'}}>
          {loading?<>⏳ {lang==='bn'?'বিশ্লেষণ হচ্ছে...':'Analysing...'}</>:<>🔍 {lang==='bn'?'যাচাই করুন':'Verify Claim'}</>}
        </button>
        {error && <div style={{marginTop:16,padding:'12px 16px',background:'#FEF2F2',borderRadius:6,color:'#B91C1C',fontSize:14,border:'1px solid #FECACA'}}>{error}</div>}
        {result && (
          <div className="ai-result card">
            <div style={{marginBottom:16}}>
              <span className={`verdict-pill ${getVerdictClass(result.verdict)}`}>
                {result.verdict==='True'?'✅':result.verdict==='False'?'❌':result.verdict==='Misleading'?'⚠️':result.verdict==='Partially True'?'🔵':'❓'} {result.verdict}
              </span>
              {result.conflictSensitivity==='high' && <span style={{marginLeft:12,fontSize:12,color:'#DC2626',fontWeight:700}}>⚡ High conflict sensitivity</span>}
              {result.sheepFlag && <span style={{marginLeft:12,padding:'4px 12px',background:'#FFFBEB',color:'#B45309',borderRadius:16,fontSize:12,fontWeight:600,border:'1px solid #FDE68A'}}>🐑 Check: {result.sheepFlag}</span>}
            </div>
            <p style={{fontSize:15,lineHeight:1.7,color:'var(--dark)',marginBottom:20}}>{result.summary}</p>
            <div style={{marginBottom:20}}>
              <div style={{fontSize:12,fontWeight:700,color:'var(--mid)',marginBottom:8,fontFamily:'Roboto Mono,monospace',letterSpacing:0.5}}>KEY POINTS</div>
              {result.keyPoints.map((p,i) => <div key={i} style={{fontSize:14,color:'var(--dark)',padding:'8px 0',borderBottom:'1px solid var(--border)',display:'flex',gap:12,lineHeight:1.5}}><span style={{color:'var(--primary)',flexShrink:0,fontWeight:'bold'}}>→</span><span>{p}</span></div>)}
            </div>
            <div style={{background:'var(--bg-color)',borderRadius:6,padding:'16px',borderLeft:'3px solid var(--primary)'}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--primary-dark)',marginBottom:6}}>💡 {lang==='bn'?'শেয়ারের পরামর্শ':'Sharing Advice'}</div>
              <div style={{fontSize:14,color:'var(--mid)',lineHeight:1.6}}>{result.advice}</div>
            </div>
            <div style={{marginTop:20,fontSize:11,color:'var(--light)',fontFamily:'Roboto Mono,monospace',textAlign:'center'}}>
              Powered by Claude AI • IFCN-aligned • ActionAid Bangladesh
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ===== MYTHS PAGE =====
function MythsPage({ lang, addXP }) {
  const [expanded, setExpanded] = useState(null);
  const [seen, setSeen] = useState([]);

  function toggle(id) {
    setExpanded(e => e===id?null:id);
    if (!seen.includes(id)) {
      setSeen(s => [...s,id]);
      addXP(5, lang==='bn'?'মিথ পড়লেন':'Read a myth');
    }
  }

  return (
    <div className="page">
      <div className="section" style={{paddingBottom:24}}>
        <div style={{maxWidth:680,margin:'0 auto'}}>
          <div className="section-tag">{lang==='bn'?'মিথ বনাম সত্য':'MYTH VS FACT'}</div>
          <h2 className="section-title">{lang==='bn'?'সাধারণ ভুল ধারণা':'Common Misconceptions'}</h2>
          <p style={{fontSize:14,color:'var(--mid)',marginBottom:24}}>+5 XP {lang==='bn'?'প্রতিটি পড়লে':'per myth read'} • {seen.length}/{MYTHS.length} {lang==='bn'?'পড়েছেন':'read'}</p>
          {MYTHS.map(m => (
            <div key={m.id} className="myth-card">
              <div className="myth-header" onClick={() => toggle(m.id)}>
                <div style={{flex:1}}>
                  <span className="myth-tag">{m.category}</span>
                  <div className="myth-q">❌ {lang==='bn'?m.myth:m.mythEn}</div>
                </div>
                <div className={`myth-chevron${expanded===m.id?' open':''}`}>▾</div>
              </div>
              {expanded===m.id && (
                <div className="myth-body">
                  <div style={{fontSize:13,fontWeight:600,color:'#15803D',marginTop:12,marginBottom:6}}>✅ {lang==='bn'?'সত্যি হলো:':'The Fact:'}</div>
                  <div className="myth-fact">{lang==='bn'?m.fact:m.factEn}</div>
                  <div className="myth-source">📌 {m.source}</div>
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ===== QUIZ PAGE =====
function QuizPage({ lang, addXP, earnBadge }) {
  const [qIdx, setQIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [feedback, setFeedback] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);

  function handleOpt(i) {
    if (selected!==null) return;
    setSelected(i);
    const ok = i===QUIZ[qIdx].correct;
    if (ok) { setScore(s=>s+1); addXP(10, lang==='bn'?'কুইজ সঠিক':'Quiz correct'); }
    setFeedback({ok,text:QUIZ[qIdx].feedback});
  }
  function nextQ() {
    if (qIdx<QUIZ.length-1) { setQIdx(q=>q+1); setSelected(null); setFeedback(null); }
    else { setDone(true); if(score+1>=4) earnBadge({id:'quiz',icon:'🧠',name:'Quiz Master'}); }
  }
  function restart() { setQIdx(0); setSelected(null); setFeedback(null); setScore(0); setDone(false); }

  if (done) return (
    <div className="page">
      <div style={{maxWidth:680,margin:'0 auto',padding:'24px 16px'}}>
        <div className="score-card card">
          <div style={{fontSize:48,marginBottom:12}}>{score>=4?'🏆':score>=3?'⭐':'📚'}</div>
          <div style={{fontSize:13,color:'var(--mid)',marginBottom:4,fontWeight:500}}>{lang==='bn'?'চূড়ান্ত স্কোর':'Final Score'}</div>
          <div className="score-big">{score}/{QUIZ.length}</div>
          <div style={{fontSize:16,fontWeight:600,color:'var(--dark)',marginTop:12,marginBottom:24}}>
            {score>=4?(lang==='bn'?'চমৎকার! আপনি একজন MIL বিশেষজ্ঞ!':'Excellent! You\'re a MIL expert!'):
             score>=3?(lang==='bn'?'ভালো! আরও একটু অনুশীলন করুন।':'Good! A bit more practice.'):
             (lang==='bn'?'UNESCO MIL মডিউলগুলো দেখুন।':'Review the UNESCO MIL modules.')}
          </div>
          <button className="btn-outline" onClick={restart}>🔄 {lang==='bn'?'আবার করুন':'Try Again'}</button>
        </div>
      </div>
    </div>
  );

  return (
    <div className="page">
      <div className="game-header">
        <div className="game-header-title">🧠 {lang==='bn'?'মিডিয়া সাক্ষরতা কুইজ':'Media Literacy Quiz'}</div>
        <div className="game-header-sub">{lang==='bn'?'Stanford, IFCN, Cambridge ও SHEEP নিয়ে':'Stanford, IFCN, Cambridge & SHEEP'}</div>
        <div className="game-progress-bar-wrap"><div className="game-progress-bar-fill" style={{width:`${((qIdx+(selected!==null?1:0))/QUIZ.length)*100}%`}}/></div>
        <div className="game-counter">{qIdx+1}/{QUIZ.length} • {lang==='bn'?'স্কোর':'Score'}: {score} • +10 XP {lang==='bn'?'প্রতিটি সঠিক':'per correct'}</div>
      </div>
      <div className="game-body">
        <div className="module-card card">
          <div className="quiz-q-num">{lang==='bn'?`প্রশ্ন ${qIdx+1} / ${QUIZ.length}`:`Question ${qIdx+1} / ${QUIZ.length}`}</div>
          <div className="quiz-question">{lang==='bn'?QUIZ[qIdx].q:QUIZ[qIdx].qEn}</div>
          <div className="quiz-options">
            {QUIZ[qIdx].options.map((o,i) => (
              <button key={i} className={`quiz-option${selected===null?'':i===QUIZ[qIdx].correct?' correct':selected===i?' wrong':''}`}
                disabled={selected!==null} onClick={() => handleOpt(i)}>{o}</button>
            ))}
          </div>
          {feedback && <div className={`quiz-feedback ${feedback.ok?'correct':'wrong'}`}><span style={{fontWeight:600}}>{feedback.ok?'✓ ':'✗ '}</span>{feedback.text}</div>}
          {selected!==null && (
            <button className="btn-primary" style={{marginTop:16,width:'100%',justifyContent:'center'}} onClick={nextQ}>
              {qIdx<QUIZ.length-1?(lang==='bn'?'পরবর্তী →':'Next →'):(lang==='bn'?'ফলাফল দেখুন →':'See Results →')}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ===== CERTIFICATE PAGE =====
function CertPage({ lang, xp, level, completedUnits, badges }) {
  const [name, setName] = useState('');
  const [nameInput, setNameInput] = useState('');
  const [generated, setGenerated] = useState(false);
  const today = new Date().toLocaleDateString(lang==='bn'?'bn-BD':'en-GB',{day:'numeric',month:'long',year:'numeric'});
  const tier = completedUnits.length>=5?3:completedUnits.length>=3?2:completedUnits.length>=1?1:0;
  const TIERS = [{},{title:lang==='bn'?'সত্যান্বেষক':'Truth Seeker',en:'Tier 1'},{title:lang==='bn'?'তথ্যযোদ্ধা':'Fact Fighter',en:'Tier 2'},{title:lang==='bn'?'সত্যরক্ষক':'Truth Defender',en:'Tier 3'}];

  function generate() {
    setName(nameInput.trim()||(lang==='bn'?'অংশগ্রহণকারী':'Participant'));
    setGenerated(true);
    if (typeof confetti==='function') confetti({particleCount:150,spread:80,origin:{y:0.6},colors:['#2563EB','#D97706','#F8FAFC']});
  }

  return (
    <div className="page">
      <div style={{maxWidth:680,margin:'0 auto',padding:'24px 16px'}}>
        {!generated ? (
          <div>
            <div className="section-tag">{lang==='bn'?'সনদপত্র':'CERTIFICATE'}</div>
            <h2 className="section-title">{lang==='bn'?'আপনার সনদ তৈরি করুন':'Generate Your Certificate'}</h2>
            <div className="card" style={{marginBottom:20}}>
              <p style={{fontSize:14,color:'var(--dark)',fontWeight:500,marginBottom:12}}>{lang==='bn'?'আপনার অগ্রগতি:':'Your Progress:'}</p>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:16}}>
                {[{l:lang==='bn'?'মোট XP':'Total XP',v:`${xp}`},{l:lang==='bn'?'স্তর':'Level',v:lang==='bn'?level.title:level.titleEn},{l:lang==='bn'?'সম্পন্ন ইউনিট':'Units',v:`${completedUnits.length}/5`}].map((s,i) => (
                  <div key={i} style={{background:'var(--bg-color)',border:'1px solid var(--border)',borderRadius:6,padding:'12px',textAlign:'center'}}>
                    <div style={{fontFamily:'Inter,sans-serif',fontSize:18,fontWeight:700,color:'var(--primary-dark)'}}>{s.v}</div>
                    <div style={{fontSize:11,color:'var(--mid)',textTransform:'uppercase',letterSpacing:0.5,marginTop:4}}>{s.l}</div>
                  </div>
                ))}
              </div>
              {tier===0 && <div style={{background:'#FFFBEB',borderRadius:6,padding:'12px 16px',fontSize:13,color:'#B45309',border:'1px solid #FDE68A'}}>{lang==='bn'?'অন্তত ১টি UNESCO MIL ইউনিট সম্পন্ন করে Tier 1 সনদ পান।':'Complete at least 1 UNESCO MIL Unit to earn a Tier 1 certificate.'}</div>}
            </div>
            {tier>0 && (
              <div>
                <input value={nameInput} onChange={e=>setNameInput(e.target.value)}
                  placeholder={lang==='bn'?'আপনার নাম লিখুন...':'Enter your full name...'}
                  style={{width:'100%',padding:'14px 16px',borderRadius:6,border:'1px solid var(--border)',fontSize:15,fontFamily:'Inter, Hind Siliguri,sans-serif',marginBottom:16,boxSizing:'border-box',boxShadow:'inset 0 1px 2px rgba(0,0,0,0.02)'}}/>
                <button className="btn-primary" onClick={generate} style={{width:'100%',justifyContent:'center'}}>
                  🏅 {lang==='bn'?'সনদ তৈরি করুন':'Generate Certificate'}
                </button>
              </div>
            )}
          </div>
        ) : (
          <div>
            <div className="cert">
              <div className="cert-logo">🛡️</div>
              <div className="cert-org">ACTIONAID BANGLADESH • EU-FUNDED PEACEBUILDING ACTION</div>
              <div className="cert-title">সত্যান্বেষক | SHOTTANNESHOK</div>
              <div className="cert-subtitle">{lang==='bn'?'মিডিয়া সাক্ষরতা সনদপত্র':'Media & Information Literacy Certificate'}</div>
              <div style={{height:1,background:'var(--border)',margin:'20px 0'}}/>
              <div style={{fontSize:13,color:'var(--mid)',marginBottom:8}}>{lang==='bn'?'এই সনদ প্রদান করা হচ্ছে':'This certifies that'}</div>
              <div className="cert-name">{name}</div>
              <div className="cert-desc" style={{maxWidth:500,margin:'0 auto 24px'}}>
                {lang==='bn'
                  ?`UNESCO MIL Module 4 পাঠ্যক্রম এবং #ThinkBeforeYouShare ডিজিটাল সাক্ষরতা উদ্যোগে সফলভাবে অংশগ্রহণ করেছেন। ${completedUnits.length}টি ইউনিট সম্পন্ন করে ${xp} XP অর্জন করেছেন।`
                  :`Has successfully participated in the UNESCO MIL Module 4 curriculum and #ThinkBeforeYouShare digital literacy initiative. Completed ${completedUnits.length} unit(s) and earned ${xp} XP.`}
              </div>
              {tier>0 && <div style={{fontSize:18,fontWeight:700,color:'var(--primary-dark)',margin:'12px 0'}}>{TIERS[tier].title} — {TIERS[tier].en}</div>}
              <div style={{fontSize:13,color:'var(--mid)',marginBottom:20}}>{today}</div>
              {badges.length>0 && (
                <div style={{display:'flex',justifyContent:'center',gap:8,flexWrap:'wrap',marginBottom:20}}>
                  {badges.map((b,i) => <span key={i} style={{fontSize:20,background:'var(--bg-color)',border:'1px solid var(--border)',padding:'6px',borderRadius:'50%'}} title={b.name}>{b.icon}</span>)}
                </div>
              )}
              <div className="cert-seal">✓ {lang==='bn'?'UNESCO MIL মডিউল ৪ পূর্ণ':'UNESCO MIL Module 4'}</div>
            </div>
            <div style={{textAlign:'center',marginTop:24,display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap'}}>
              <button className="btn-outline" onClick={() => {setGenerated(false);setNameInput('');setName('');}}>← {lang==='bn'?'ফিরুন':'Back'}</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
